include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/api/**/generated/**"
    - "lib/l10n/app_localizations*.dart"
    - build/**
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Public API docs are required in lib/ui (design system) only; enforced
    # by review, not by lint, to keep feature code free of boilerplate docs.
    public_member_api_docs: false
