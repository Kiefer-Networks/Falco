name: falco
description: "Hetzner Cloud, Robot, DNS and Storage manager"
publish_to: "none"

# Build number continues above Falco 2 (last Android versionCode 250) so
# existing Android installs receive Falco 3 as an update.
version: 3.0.0+300

environment:
  sdk: ^3.14.0
  # Exact Flutter SDK for local builds and CI (read by subosito/flutter-action).
  # Kept current by .github/workflows/flutter-sdk.yml.
  flutter: 3.50.1

dependencies:
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
