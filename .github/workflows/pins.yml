name: Certificate pins

# Recomputes the SPKI pins of all API hosts (tool/pins.dart) and opens a PR
# when a chain changed. Pins no longer served stay 90 days as overlap.
# PRs created with GITHUB_TOKEN start no pull_request workflows, so the job
# starts CI on the update branch by workflow_dispatch.

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

concurrency:
  group: pins-update
  cancel-in-progress: false

permissions: {}

jobs:
  update:
    name: Recompute pins
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the update branch and commit
      pull-requests: write # open the PR
      actions: write # start CI on the update branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false # the commit goes through the API

      # Same installation as ci.yml: the official repo at the pinned version.
      - name: Install Flutter
        run: |
          set -euo pipefail
          version=$(sed -n 's/^  flutter: *//p' pubspec.yaml)
          git clone --quiet --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --disable-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Compute pins
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          dart run tool/pins.dart | tee "$RUNNER_TEMP/chains.txt"

      - name: Open PR on change
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Dart pins plus the native ones of Object Storage (background
          # transfers run in the platform HTTP stacks).
          files=(tool/pins.json lib/core/pins/pins.g.dart
            android/app/src/main/res/xml/network_security_config.xml
            android/app/src/main/res/raw ios/Runner/Info.plist)
          if [ -z "$(git status --porcelain -- "${files[@]}")" ]; then
            echo "Pins unchanged"
            exit 0
          fi
          branch="pins/update-$(date -u +%Y-%m-%d)"
          title="chore: Update certificate pins"
          {
            echo "The certificate chain of at least one API host changed."
            echo "Retired pins stay 90 days so released versions keep working."
            echo
            echo '```'
            cat "$RUNNER_TEMP/chains.txt"
            echo '```'
            echo
            echo '```diff'
            { git diff -- tool/pins.json | grep -v '"der"' || true; }
            echo '```'
            echo
            echo "CI starts by itself on the update branch. When squash merging,"
            echo "remove the Co-authored-by line of the bot from the message."
          } > "$RUNNER_TEMP/body.md"
          open_pr() {
            gh pr create --base "$BASE" --head "$branch" --title "$title" \
              --body-file "$RUNNER_TEMP/body.md" && { gh workflow run ci.yml --ref "$branch"; return; }
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            exit 1
          }
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            if [ "$(gh pr list --head "$branch" --state all --json number --jq length)" != 0 ]; then
              # Closed or merged counts too, so a declined PR is not reopened.
              echo "PR for $branch exists already"
            else
              open_pr
            fi
            exit 0
          fi
          # Commit through the API so GitHub signs it; the author stays
          # github-actions[bot].
          git add -- "${files[@]}"
          head=$(git rev-parse HEAD)
          : > "$RUNNER_TEMP/additions.jsonl"
          while IFS= read -r -d '' f; do
            base64 -w0 -- "$f" > "$RUNNER_TEMP/content.b64"
            jq -cn --arg path "$f" --rawfile contents "$RUNNER_TEMP/content.b64" \
              '{path: $path, contents: $contents}' >> "$RUNNER_TEMP/additions.jsonl"
          done < <(git diff --cached --name-only --no-renames --diff-filter=d -z)
          git diff --cached --name-only --no-renames --diff-filter=D -z \
            | jq -Rs 'split("\u0000") | map(select(. != "") | {path: .})' \
            > "$RUNNER_TEMP/deletions.json"
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg branch "$branch" \
            --arg head "$head" --arg message "$title" \
            --slurpfile additions "$RUNNER_TEMP/additions.jsonl" \
            --slurpfile deletions "$RUNNER_TEMP/deletions.json" \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $head, message: {headline: $message},
                fileChanges: {additions: $additions, deletions: $deletions[0]}}}}' \
            > "$RUNNER_TEMP/commit.json"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/heads/$branch" -f sha="$head" > /dev/null
          if ! gh api graphql --input "$RUNNER_TEMP/commit.json" \
            --jq .data.createCommitOnBranch.commit.oid; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            exit 1
          fi
          open_pr
