name: Flutter SDK update

# Opens a PR when a newer stable Flutter release exists than the one pinned in
# pubspec.yaml (environment.flutter). PRs created with GITHUB_TOKEN start no
# workflows: re-run CI on the PR (close and reopen it) before merging.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: flutter-sdk-update
  cancel-in-progress: false

permissions: {}

jobs:
  update:
    name: Check stable Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the update branch and commit
      pull-requests: write # open the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: next # runs from main until Falco 3 replaces it
          persist-credentials: false # the commit goes through the API

      - name: Compare and open PR
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: next
        run: |
          set -euo pipefail
          latest=$(curl -fsSL https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json \
            | jq -r '.current_release.stable as $h | .releases[] | select(.hash == $h) | .version')
          current=$(sed -n 's/^  flutter: *//p' pubspec.yaml)
          echo "current=$current latest=$latest"
          if [ -z "$latest" ] || [ "$latest" = "$current" ]; then
            exit 0
          fi
          branch="deps/flutter-$latest"
          title="build(deps): Update Flutter to $latest"
          open_pr() {
            gh pr create --base "$BASE" --head "$branch" --title "$title" \
              --body "Flutter $current to $latest. Close and reopen this PR to run CI. When squash merging, remove the Co-authored-by line of the bot from the message." \
              && return
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            exit 1
          }
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            if [ "$(gh pr list --head "$branch" --json number --jq length)" != 0 ]; then
              echo "PR for $branch is open already"
            else
              open_pr
            fi
            exit 0
          fi
          sed -i "s/^  flutter: .*/  flutter: $latest/" pubspec.yaml
          # Resolve with the new SDK, so pubspec.lock matches it.
          git clone --quiet --depth 1 --branch "$latest" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          "$RUNNER_TEMP/flutter/bin/flutter" --disable-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" pub get
          # Commit through the API so GitHub signs it; the author stays
          # github-actions[bot].
          head=$(git rev-parse HEAD)
          base64 -w0 pubspec.yaml > "$RUNNER_TEMP/pubspec.b64"
          base64 -w0 pubspec.lock > "$RUNNER_TEMP/lock.b64"
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg branch "$branch" \
            --arg head "$head" --arg message "$title" \
            --rawfile pubspec "$RUNNER_TEMP/pubspec.b64" \
            --rawfile lock "$RUNNER_TEMP/lock.b64" \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $head, message: {headline: $message},
                fileChanges: {additions: [
                  {path: "pubspec.yaml", contents: $pubspec},
                  {path: "pubspec.lock", contents: $lock}]}}}}' \
            > "$RUNNER_TEMP/commit.json"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/heads/$branch" -f sha="$head" > /dev/null
          if ! gh api graphql --input "$RUNNER_TEMP/commit.json" \
            --jq .data.createCommitOnBranch.commit.oid; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            exit 1
          fi
          open_pr
