name: Release — Build & Publish

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - id: version
        name: Extract version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Verify tag matches versionName
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG_VERSION="${REF#v}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag '$REF' (parsed as '$TAG_VERSION') does not match app/build.gradle.kts versionName '$VERSION'"
            exit 1
          fi
          echo "Tag $REF matches versionName $VERSION"

      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520  # v5.4.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92  # v6.2.0
        with:
          # Release builds start from a clean Gradle home: no cache can
          # inject anything into signed artifacts.
          cache-disabled: true

      - name: Lint (debug)
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Lint (release)
        run: ./gradlew :app:lintRelease --no-daemon

      - name: Unit tests (debug)
        run: ./gradlew testDebugUnitTest --no-daemon

  build-android:
    name: Android (APK + AAB)
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Signing secrets belong in this environment, restricted to v* tags.
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520  # v5.4.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92  # v6.2.0
        with:
          # Release builds start from a clean Gradle home: no cache can
          # inject anything into signed artifacts.
          cache-disabled: true

      - name: Verify signing secrets present
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 secret missing — refusing to publish unsigned APK"
            exit 1
          fi

      - name: Set up signing materials
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail
          # Locked-down umask so any file the heredoc creates is owner-only,
          # even if the runner ever shares the work tree with another step.
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
          cat > keystore.properties <<KP
          storePassword=${STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=keystore.jks
          KP
          chmod 600 app/keystore.jks keystore.properties

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Build AAB
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Rename artifacts
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/*.apk \
             "release-assets/Falco-${VERSION}.apk" 2>/dev/null || true
          find app/build/outputs/bundle -name "*.aab" -exec cp {} \
             "release-assets/Falco-${VERSION}.aab" \; 2>/dev/null || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: android-apk
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: android-aab
          path: release-assets/*.aab
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup signing materials
        if: ${{ always() }}
        run: rm -f keystore.properties app/keystore.jks

  release:
    name: Create GitHub Release
    needs: [preflight, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write # sign build provenance (Sigstore)
      attestations: write # store build provenance
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: android-apk
          path: artifacts/android-apk/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: android-aab
          path: artifacts/android-aab/

      - name: Collect release assets
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp "artifacts/android-apk/Falco-${VERSION}.apk" release-assets/
          cp "artifacts/android-aab/Falco-${VERSION}.aab" release-assets/
          ls -lh release-assets/
          (cd release-assets && sha256sum Falco-* > SHA256SUMS)

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: release-assets/Falco-*

      - name: Generate release notes
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          cat > release-notes.md <<NOTES
          ## Falco ${VERSION}

          Privacy-respecting Hetzner manager for Android.

          ### Downloads

          | Platform | File |
          |----------|------|
          | Android (APK) | \`Falco-${VERSION}.apk\` |
          | Android (AAB) | \`Falco-${VERSION}.aab\` |

          Verify: \`sha256sum -c SHA256SUMS\` and
          \`gh attestation verify Falco-${VERSION}.apk --repo Kiefer-Networks/Falco\`

          ---
          **License:** GPL-3.0-or-later · **Donate:** https://de.liberapay.com/beli3ver
          NOTES
          sed -i 's/^          //' release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Falco ${VERSION}" \
            --notes-file release-notes.md \
            release-assets/Falco-*.apk \
            release-assets/Falco-*.aab \
            release-assets/SHA256SUMS
