# SPDX-License-Identifier: GPL-3.0-or-later
# Release pipeline, see docs/target/RELEASE.md.
#
# Signed tag v* (version from pubspec.yaml):
#   Android: signed AAB and APK, GitHub Release with SHA256SUMS and build
#   provenance, AAB to the Google Play internal track.
#   iOS: signed IPA to TestFlight.
# Manual run on that tag (workflow_dispatch):
#   promote the internal Play release and/or submit the TestFlight build for
#   App Review. Nothing is rebuilt.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      play_track:
        description: "Promote the internal Play release of this tag to"
        type: choice
        options: [none, alpha, beta, production]
        default: none
      ios_submit:
        description: "Submit the TestFlight build of this tag for App Review"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - id: version
        name: Tag matches pubspec version
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != tag ]; then
            echo "::error::Run this workflow on a release tag (v*), not on a branch"
            exit 1
          fi
          line=$(sed -n 's/^version: *//p' pubspec.yaml)
          version=${line%%+*}
          build=${line##*+}
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match pubspec.yaml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Tag is signed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ref=$(gh api "repos/$REPO/git/ref/tags/$TAG")
          if [ "$(jq -r .object.type <<<"$ref")" != tag ]; then
            echo "::error::$TAG is a lightweight tag; create it with git tag -s"
            exit 1
          fi
          verified=$(gh api "repos/$REPO/git/tags/$(jq -r .object.sha <<<"$ref")" --jq .verification.verified)
          if [ "$verified" != true ]; then
            echo "::error::Tag $TAG has no verified signature"
            exit 1
          fi

  android:
    name: Android (AAB + APK)
    needs: preflight
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
    steps:
      - name: Signing secrets present
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEY_ALIAS KEY_PASSWORD STORE_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret $name is missing in environment release"
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      # Same as ci.yml: Flutter from the official repo at the pubspec version.
      - name: Install Flutter
        run: |
          set -euo pipefail
          version=$(sed -n 's/^  flutter: *//p' pubspec.yaml)
          git clone --quiet --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --disable-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Analyze and test
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --fatal-infos
          flutter test --exclude-tags golden

      - name: Upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          umask 077
          base64 --decode <<<"$KEYSTORE_BASE64" > "$RUNNER_TEMP/upload.jks"

      # Read by android/app/build.gradle.kts.
      - name: Build signed AAB and APK
        env:
          FALCO_STORE_FILE: ${{ runner.temp }}/upload.jks
          FALCO_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          FALCO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FALCO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build appbundle --release
          flutter build apk --release

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Collect artifacts
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          mkdir dist
          cp build/app/outputs/bundle/release/app-release.aab "dist/Falco-$VERSION.aab"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Falco-$VERSION.apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: android
          path: dist/
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: GitHub Release
    needs: [preflight, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: android
          path: dist

      - name: Checksums
        working-directory: dist
        run: sha256sum Falco-* > SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/Falco-*.aab
            dist/Falco-*.apk

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "Falco $VERSION" \
            --generate-notes

  play-internal:
    name: Google Play (internal)
    needs: [preflight, android]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
    env:
      BUNDLE_DEPLOYMENT: "true"
      FASTLANE_OPT_OUT_USAGE: "YES"
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      LC_ALL: en_US.UTF-8
    steps:
      - name: Play secret present
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::Secret PLAY_SERVICE_ACCOUNT_JSON is missing in environment release"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18  # v1.343.0

      - name: Install fastlane
        run: bundle install --jobs 4

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: android
          path: dist

      - name: Upload to the internal track
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: bundle exec fastlane android internal "aab:dist/Falco-$VERSION.aab"

  ios:
    name: iOS (TestFlight)
    needs: preflight
    if: github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    env:
      BUNDLE_DEPLOYMENT: "true"
      FASTLANE_OPT_OUT_USAGE: "YES"
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      LC_ALL: en_US.UTF-8
    steps:
      - name: iOS secrets present
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          missing=0
          for name in IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret $name is missing in environment release"
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Same as ci.yml: Flutter from the official repo at the pubspec version.
      - name: Install Flutter
        run: |
          set -euo pipefail
          version=$(sed -n 's/^  flutter: *//p' pubspec.yaml)
          git clone --quiet --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --disable-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      # Distribution certificate in a throwaway keychain, the App Store
      # profile installed, and manual signing for the Runner target through
      # ios/Flutter/Signing.xcconfig (included by Release.xcconfig).
      - name: Signing
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(openssl rand -base64 32)
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          base64 --decode <<<"$IOS_DIST_CERT_P12_BASE64" > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -f pkcs12 \
            -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$password" "$keychain" > /dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          profile="$RUNNER_TEMP/profile.mobileprovision"
          base64 --decode <<<"$IOS_PROVISIONING_PROFILE_BASE64" > "$profile"
          security cms -D -i "$profile" > "$RUNNER_TEMP/profile.plist"
          read_profile() { /usr/libexec/PlistBuddy -c "Print :$1" "$RUNNER_TEMP/profile.plist"; }
          uuid=$(read_profile UUID)
          team=$(read_profile TeamIdentifier:0)
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$profile" "$dir/$uuid.mobileprovision"
          done

          {
            echo "CODE_SIGN_STYLE = Manual"
            echo "DEVELOPMENT_TEAM = $team"
            echo "CODE_SIGN_IDENTITY = Apple Distribution"
            echo "CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution"
            echo "PROVISIONING_PROFILE_SPECIFIER = $uuid"
          } > ios/Flutter/Signing.xcconfig

          options="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy \
            -c "Add :method string app-store-connect" \
            -c "Add :teamID string $team" \
            -c "Add :signingStyle string manual" \
            -c "Add :provisioningProfiles dict" \
            -c "Add :provisioningProfiles:de.kiefer-networks.falco string $uuid" \
            "$options"

      - name: Build IPA
        run: |
          flutter pub get --enforce-lockfile
          flutter build ipa --release --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          rm -f "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist" ios/Flutter/Signing.xcconfig

      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18  # v1.343.0

      - name: Install fastlane
        run: bundle install --jobs 4

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          ipa=$(find build/ios/ipa -name '*.ipa' | head -1)
          bundle exec fastlane ios beta "ipa:$ipa"

  play-promote:
    name: Google Play (promote)
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && inputs.play_track != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    env:
      BUNDLE_DEPLOYMENT: "true"
      FASTLANE_OPT_OUT_USAGE: "YES"
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      LC_ALL: en_US.UTF-8
    steps:
      - name: Play secret present
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::Secret PLAY_SERVICE_ACCOUNT_JSON is missing in environment release"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18  # v1.343.0

      - name: Install fastlane
        run: bundle install --jobs 4

      - name: Promote internal release
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          TRACK: ${{ inputs.play_track }}
          BUILD: ${{ needs.preflight.outputs.build }}
        run: bundle exec fastlane android promote "track:$TRACK" "version_code:$BUILD"

  ios-submit:
    name: App Store (submit for review)
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && inputs.ios_submit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
    env:
      BUNDLE_DEPLOYMENT: "true"
      FASTLANE_OPT_OUT_USAGE: "YES"
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      LC_ALL: en_US.UTF-8
    steps:
      - name: App Store Connect secrets present
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret $name is missing in environment release"
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18  # v1.343.0

      - name: Install fastlane
        run: bundle install --jobs 4

      - name: Submit for review
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          VERSION: ${{ needs.preflight.outputs.version }}
          BUILD: ${{ needs.preflight.outputs.build }}
        run: bundle exec fastlane ios submit "version:$VERSION" "build_number:$BUILD"
