name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, next]
  # Auto merges push with GITHUB_TOKEN, which starts no workflows; the daily
  # run makes sure the default branches are built anyway.
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Flutter straight from the official repo at the exact version pinned
      # in pubspec.yaml. No third-party setup action: subosito/flutter-action
      # references actions/cache by tag, which the SHA pinning rule rejects.
      - name: Install Flutter
        run: |
          set -euo pipefail
          version=$(sed -n 's/^  flutter: *//p' pubspec.yaml)
          git clone --quiet --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --disable-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Dependencies
        run: flutter pub get --enforce-lockfile

      # Riverpod and go_router code is committed; fail when it is stale.
      - name: Generated code is current
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool

      # Every PARITY row is named by a test or deferred with a reason.
      - name: Parity check
        run: dart run tool/parity_check.dart

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Tests
        run: flutter test --reporter expanded --exclude-tags golden

  build-android:
    name: Build Debug APK
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      # Flutter straight from the official repo at the exact version pinned
      # in pubspec.yaml. No third-party setup action: subosito/flutter-action
      # references actions/cache by tag, which the SHA pinning rule rejects.
      - name: Install Flutter
        run: |
          set -euo pipefail
          version=$(sed -n 's/^  flutter: *//p' pubspec.yaml)
          git clone --quiet --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --disable-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Build debug APK
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --debug

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: falco-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  build-ios:
    name: Build iOS
    needs: lint-and-test
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Flutter straight from the official repo at the exact version pinned
      # in pubspec.yaml. No third-party setup action: subosito/flutter-action
      # references actions/cache by tag, which the SHA pinning rule rejects.
      - name: Install Flutter
        run: |
          set -euo pipefail
          version=$(sed -n 's/^  flutter: *//p' pubspec.yaml)
          git clone --quiet --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --disable-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Build iOS without code signing
        run: |
          flutter pub get --enforce-lockfile
          flutter build ios --no-codesign --debug

      - name: Golden tests
        run: flutter test --tags golden

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # summary comment on the PR
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec  # v5.0.1
        with:
          fail-on-severity: low
          comment-summary-in-pr: on-failure
          # pub reports lower-case SPDX ids (apache-2.0), which this action
          # rejects as invalid; licences are checked by a dedicated job later.
          license-check: false

  zizmor:
    name: Workflow Security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd  # v0.8.1
        with:
          persona: pedantic
          version: 1.32.0
          # Fail the job on findings instead of only uploading SARIF.
          advanced-security: false
