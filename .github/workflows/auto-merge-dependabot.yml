# SPDX-License-Identifier: GPL-3.0-or-later
#
# Auto-merge non-breaking Dependabot PRs once required CI checks pass.
#
# Policy:
#   * `version-update:semver-patch` and `version-update:semver-minor` ->
#     `gh pr merge --auto --squash` on the default branch. The merge fires
#     only after every required status check in the main ruleset has passed,
#     so a regression blocks the merge and the PR stays open for human triage.
#     Other branches (next) have no ruleset, so `--auto` would merge at once:
#     there the job waits for the CI checks of the PR head itself, merges only
#     when all passed, and then starts CI on the branch (a merge through
#     GITHUB_TOKEN starts no push workflow).
#   * `version-update:semver-major` -> leave open, attach an `automerge-skipped`
#     label, comment with the reason. Maintainer reviews manually.
#
# Author check: the PR author (not the triggering actor, which a human can be
# on re-runs) must be `dependabot[bot]`, and the head branch must live in this
# repository. Forks and human PRs go nowhere through this workflow.
#
# Untrusted-input note: every github.event.* string is bound through `env:`
# and quoted in shell to prevent expression injection.

name: Dependabot auto-merge

on:
  pull_request:
    # No `labeled`: label changes must not re-run this and re-arm auto-merge.
    types: [opened, synchronize, reopened]

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  auto-merge:
    name: Auto-merge
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Long enough for the iOS build on branches without a ruleset.
    timeout-minutes: 75
    permissions:
      contents: write # merge
      pull-requests: write # label + comment
      checks: read # wait for the CI checks of the head
      actions: write # start CI on the branch after the merge
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0

      - name: Merge patch + minor after green CI
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$BASE" = "$DEFAULT_BRANCH" ]; then
            gh pr merge --auto --squash "$PR_URL"
            exit 0
          fi
          # The checks ci.yml and chore.yml report for a pull request.
          required=("Check PR Title" "Dependency Review" "Lint & Unit Tests"
            "Workflow Security (zizmor)" "Build Debug APK" "Build iOS")
          while :; do
            runs=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs" \
              --jq '.check_runs[] | [.name, .status, (.conclusion // "")] | @tsv')
            pending=0
            for name in "${required[@]}"; do
              # The API lists only the latest run per name (filter=latest).
              line=$(printf '%s\n' "$runs" | awk -F'\t' -v n="$name" '$1 == n' | head -n 1)
              if [ -z "$line" ] || [ "$(cut -f2 <<<"$line")" != completed ]; then
                pending=1
                continue
              fi
              case "$(cut -f3 <<<"$line")" in
                success | skipped | neutral) ;;
                *)
                  echo "Check '$name' did not pass; leaving the PR open."
                  exit 0
                  ;;
              esac
            done
            [ "$pending" = 0 ] && break
            sleep 30
          done
          gh pr merge --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
          gh workflow run ci.yml --ref "$BASE"

      - name: Skip + label majors
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        # A group PR can be updated in place from minor to major; drop any
        # auto-merge armed by an earlier run. Fails harmlessly if none is set.
        run: |
          gh pr merge --disable-auto "$PR_URL" || true
          gh pr edit "$PR_URL" --add-label automerge-skipped
          gh pr comment "$PR_URL" --body "Auto-merge skipped: this is a major version bump. Falco's toolchain (AGP, Kotlin, AndroidX security, biometric, Compose BOM) regularly ships breaking changes inside majors. Please review the upstream changelog, run a clean build locally, and merge manually."
