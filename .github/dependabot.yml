# Falco — Dependabot configuration
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Every dependency stays on its newest version:
#  - pub (Dart / Flutter packages, pubspec.yaml + pubspec.lock)
#  - Gradle (Android host project under android/)
#  - GitHub Actions (pinned by SHA in the workflows)
#  - Bundler (fastlane for the store uploads)
# The Flutter SDK itself is kept current by .github/workflows/flutter-sdk.yml.
#
# Cooldown: 7 days for version updates (security updates are immediate).
# Auto-merge policy lives in auto-merge-dependabot.yml: patch + minor merge
# after green CI, majors stay manual.

version: 2

updates:
  - package-ecosystem: pub
    directory: "/"
    target-branch: next
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    labels: [dependencies, dart]
    commit-message:
      prefix: "build"
      include: scope
    groups:
      pub-non-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [patch, minor]

  - package-ecosystem: gradle
    directory: "/android"
    target-branch: next
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels: [dependencies, gradle]
    commit-message:
      prefix: "build"
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: next
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      actions:
        patterns: ["*"]

  # fastlane for the store uploads in release.yml (Gemfile.lock)
  - package-ecosystem: bundler
    directory: "/"
    target-branch: next
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels: [dependencies, ruby]
    commit-message:
      prefix: "build"
      include: scope
    groups:
      bundler-non-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [patch, minor]
